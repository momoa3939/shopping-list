<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F6CF68">
<title>お買い物リスト</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFDF9;
    --surface:#FFFFFF;
    --text:#6B5646;
    --muted:#9C8874;
    --rose:#F6CF68;
    --rose-dark:#DDAE3F;
    --star:#E8BC5A;
    --star-off:var(--delete-muted);
    --delete-muted:#BBA99A;
    --danger-text:#B8747C;
    --danger-bg:#F6E6E4;
    --danger-border:#E9C9C7;
    --divider:#EFE4D5;
    --shadow: 0 4px 16px rgba(140,118,102,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans JP','Hiragino Sans',sans-serif;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    position:relative;
  }
  header.topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    margin:14px 18px 6px;
    position:sticky;
    top:14px;
    background:var(--surface);
    border-radius:18px;
    box-shadow:var(--shadow);
    z-index:5;
  }
  header.topbar h1{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:20px;
    margin:0;
    flex:1;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .title-icon{
    display:inline-flex;
    color:var(--rose);
    flex-shrink:0;
  }
  .title-icon svg{ width:26px; height:26px; }
  .iconbtn{
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background:var(--surface);
    box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--text);
    flex-shrink:0;
  }
  .iconbtn svg{width:19px; height:19px;}
  main{ flex:1; padding:4px 18px 100px; }
  main.with-hero{ padding-bottom:230px; }

  /* ---- Home: list of lists ---- */
  .list-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--surface);
    border-radius:18px;
    padding:16px 16px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .dot{
    width:16px; height:16px;
    border-radius:50%;
    flex-shrink:0;
  }
  .list-card .name{
    flex:1;
    font-weight:700;
    font-size:16px;
    font-family:'Zen Maru Gothic', sans-serif;
  }
  .list-card .count{
    font-size:13px;
    color:var(--muted);
    padding:3px 6px;
  }
  .list-edit-btn{
    width:30px; height:30px;
    border:none;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    color:var(--muted);
  }
  .list-edit-btn svg{ width:16px; height:16px; }
  .fab{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    max-width:480px;
    width:calc(100% - 36px);
    margin:0 18px;
  }
  .fab-inner{
    background:var(--rose);
    color:var(--text);
    border:none;
    width:100%;
    padding:15px;
    border-radius:16px;
    font-size:15px;
    font-weight:700;
    font-family:'Zen Maru Gothic', sans-serif;
    box-shadow:0 6px 18px rgba(246,207,104,0.4);
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
  }
  .fab-inner svg{
    width:18px; height:18px;
    flex-shrink:0;
  }
  .empty-hint{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-top:36px;
    line-height:1.8;
  }
  .empty-hint img{
    width:150px;
    height:auto;
    margin-bottom:8px;
  }
  .home-hero-fixed{
    position:fixed;
    left:50%;
    bottom:140px;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    pointer-events:none;
    z-index:4;
  }
  .home-hero-fixed img{
    width:120px;
    height:auto;
    object-fit:contain;
    display:block;
    margin:0 auto 4px;
  }

  /* ---- Detail screen ---- */
  .add-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border-radius:16px;
    padding:6px 8px 6px 16px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .add-row input{
    flex:1;
    border:none;
    outline:none;
    font-size:15px;
    padding:10px 0;
    background:transparent;
    font-family:'Noto Sans JP',sans-serif;
    color:var(--text);
  }
  .add-row input::placeholder{ color:var(--muted); }
  .add-row button{
    width:36px; height:36px;
    border-radius:50%;
    border:none;
    background:var(--rose);
    color:#fff;
    font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }

  .fav-section{ margin-bottom:18px; }
  .fav-label{
    font-size:12px;
    color:var(--muted);
    margin:0 0 8px 4px;
    display:flex; align-items:center; gap:4px;
  }
  .fav-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:none;
  }
  .fav-scroll::-webkit-scrollbar{ display:none; }
  .fav-chip{
    flex-shrink:0;
    background:#fff;
    border:1px solid var(--divider);
    color:var(--text);
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    display:flex; align-items:center; gap:4px;
    cursor:pointer;
    white-space:nowrap;
  }
  .fav-chip.added{
    opacity:0.4;
  }

  .item-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border-radius:16px;
    padding:14px 14px;
    margin-bottom:8px;
    box-shadow:var(--shadow);
  }
  .check{
    width:24px; height:24px;
    border-radius:50%;
    border:2px solid var(--rose);
    flex-shrink:0;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
  }
  .check.done{
    background:var(--rose);
    border-color:var(--rose);
  }
  .check svg{ width:13px; height:13px; opacity:0; }
  .check.done svg{ opacity:1; }
  .item-text{
    flex:1;
    font-size:15px;
    word-break:break-all;
  }
  .item-row.done .item-text{
    color:var(--muted);
    text-decoration:line-through;
  }
  .starbtn, .trashbtn{
    width:28px; height:28px;
    border:none;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    color:var(--star-off);
  }
  .starbtn.on{ color:var(--star); }
  .starbtn svg, .trashbtn svg{ width:19px; height:19px; }
  .trashbtn{ color:var(--delete-muted); }

  .done-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
    font-size:13px;
    padding:12px 4px;
    cursor:pointer;
  }
  .done-toggle svg{
    width:12px; height:12px;
    transition:transform 0.2s;
  }
  .done-toggle.open svg{ transform:rotate(90deg); }
  .clear-done{
    text-align:right;
    font-size:12px;
    color:var(--delete-muted);
    margin:4px 4px 10px;
    cursor:pointer;
  }

  /* ---- History ---- */
  .history-date{
    font-size:13px;
    color:var(--muted);
    margin:18px 4px 8px;
  }
  .history-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border-radius:16px;
    padding:14px 14px;
    margin-bottom:8px;
    box-shadow:var(--shadow);
  }
  .history-check{
    width:24px; height:24px;
    border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .history-check svg{ width:13px; height:13px; }
  .history-body{ flex:1; }
  .history-text{
    font-size:15px;
    color:var(--muted);
    text-decoration:line-through;
  }
  .history-list{
    font-size:12px;
    color:var(--muted);
    display:flex; align-items:center; gap:5px;
    margin-top:3px;
  }
  .history-list .dot{
    width:8px; height:8px;
  }
  .history-delete-btn{
    width:28px; height:28px;
    border:none;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    color:var(--delete-muted);
  }
  .history-delete-btn svg{ width:17px; height:17px; }

  /* ---- Modal ---- */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(58,53,50,0.35);
    display:flex; align-items:flex-end;
    z-index:20;
  }
  .modal-backdrop.hidden{ display:none; }
  .modal-sheet{
    background:var(--surface);
    width:100%;
    max-width:480px;
    margin:0 auto;
    border-radius:22px 22px 0 0;
    padding:22px 20px 28px;
  }
  .modal-sheet h2{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:17px;
    margin:0 0 16px;
  }
  .modal-sheet input[type=text]{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1px solid var(--divider);
    font-size:15px;
    margin-bottom:16px;
    font-family:'Noto Sans JP',sans-serif;
    color:var(--text);
    outline:none;
  }
  .color-row{
    display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap;
  }
  .color-swatch{
    width:30px; height:30px;
    border-radius:50%;
    cursor:pointer;
    border:3px solid transparent;
  }
  .color-swatch.selected{
    border-color:var(--text);
  }
  .modal-actions{
    display:flex; gap:10px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:12px;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--muted);
    font-size:14px;
    font-weight:700;
    font-family:'Zen Maru Gothic', sans-serif;
    cursor:pointer;
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  .btn:hover, .btn:active{
    background:var(--rose);
    color:var(--text);
    border-color:var(--rose);
  }
</style>
</head>
<body>
<div id="app">

  <header class="topbar" id="topbar"></header>
  <main id="main"></main>

  <div class="home-hero-fixed" id="homeHeroFixed" style="display:none;">
    <img src="panda13.png" alt="">
    今日は何をメモしよっか?
  </div>

  <div class="fab" id="fab" style="display:none;">
    <button class="fab-inner" id="fabBtn"></button>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal-sheet" id="modalSheet"></div>
  </div>

</div>

<script>
/* ====================== データ管理 ====================== */
const STORAGE_KEY = "yumeListData";
const PALETTE = ["#A8BFA5","#BFD6E8","#E6B8BE","#C7B299","#CDBFDD","#B8B2A9","#F0C9B0","#D9BB6E","#B9C39A","#C7A3AC"];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function loadData(){
  let data = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) data = JSON.parse(raw);
  }catch(e){}
  if(!data){
    data = {
      lists:[
        { id: uid(), name:"買うもの", color:"#A8BFA5", items:[], favorites:[] },
        { id: uid(), name:"美容系で買うもの", color:"#E6B8BE", items:[], favorites:[] }
      ],
      history:[]
    };
  }
  if(!data.history) data.history = [];
  return data;
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const state = {
  data: loadData(),
  view: "home",        // "home" | "detail" | "history"
  currentListId: null
};

/* ====================== 完了アイテムの履歴移動 ====================== */
function migrateCompletedToHistory(){
  let changed = false;
  state.data.lists.forEach(list => {
    const stillActive = [];
    list.items.forEach(item => {
      if(item.done){
        state.data.history.unshift({
          id: uid(),
          text: item.text,
          listName: list.name,
          listColor: list.color,
          date: item.doneAt || todayStr()
        });
        changed = true;
      }else{
        stillActive.push(item);
      }
    });
    list.items = stillActive;
  });
  if(changed) saveData();
}
migrateCompletedToHistory();

/* ====================== アイコン ====================== */
const ICONS = {
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="#6B5646" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 7"/></svg>`,
  star: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.7 1.6 7-6.2-3.8L5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>`,
  starOutline: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.7 1.6 7-6.2-3.8L5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  chevron: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`,
  gear: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1h.1a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>`,
  pencil: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>`,
  basket: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9c0-3 1.6-5.5 5-5.5S17 6 17 9"/><path d="M4.3 9h15.4l-1.3 9.6a2.3 2.3 0 01-2.3 2H8a2.3 2.3 0 01-2.3-2L4.3 9z"/><path d="M9 12.5v5M12 12.5v5M15 12.5v5"/></svg>`,
  history: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3.5 2"/></svg>`
};

/* ====================== 描画 ====================== */
const topbar = document.getElementById("topbar");
const mainEl = document.getElementById("main");
const fab = document.getElementById("fab");
const fabBtn = document.getElementById("fabBtn");
const homeHeroFixed = document.getElementById("homeHeroFixed");
const modalBackdrop = document.getElementById("modalBackdrop");
const modalSheet = document.getElementById("modalSheet");

function render(){
  if(state.view === "home") renderHome();
  else if(state.view === "history") renderHistory();
  else renderDetail();
}

function renderHome(){
  topbar.innerHTML = `
    <h1><span class="title-icon">${ICONS.basket}</span>お買い物リスト</h1>
    <button class="iconbtn" id="historyBtn">${ICONS.history}</button>
  `;
  document.getElementById("historyBtn").onclick = () => { state.view = "history"; render(); };
  fab.style.display = "block";
  fabBtn.innerHTML = `${ICONS.plus} 新しいリスト`;
  fabBtn.onclick = () => openListModal(null);

  if(state.data.lists.length === 0){
    homeHeroFixed.style.display = "none";
    mainEl.classList.remove("with-hero");
    mainEl.innerHTML = `<div class="empty-hint"><img src="panda-empty.png" alt=""><br>まだリストがありません。<br>下のボタンから作ってみてください🛍️</div>`;
    return;
  }

  homeHeroFixed.style.display = "block";
  mainEl.classList.add("with-hero");

  mainEl.innerHTML = state.data.lists.map(list => {
    const remaining = list.items.filter(i => !i.done).length;
    return `
      <div class="list-card" data-id="${list.id}">
        <div class="dot" style="background:${list.color}"></div>
        <div class="name">${escapeHtml(list.name)}</div>
        <div class="count">${remaining}</div>
        <button class="list-edit-btn" data-id="${list.id}">${ICONS.pencil}</button>
      </div>
    `;
  }).join("");

  mainEl.querySelectorAll(".list-card").forEach(card => {
    card.addEventListener("click", () => {
      state.currentListId = card.dataset.id;
      state.view = "detail";
      render();
    });
  });

  mainEl.querySelectorAll(".list-edit-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      openListModal(btn.dataset.id);
    });
  });
}

function getCurrentList(){
  return state.data.lists.find(l => l.id === state.currentListId);
}

function renderDetail(){
  const list = getCurrentList();
  if(!list){ state.view = "home"; render(); return; }

  topbar.innerHTML = `
    <button class="iconbtn" id="backBtn">${ICONS.back}</button>
    <h1>${escapeHtml(list.name)}</h1>
  `;
  document.getElementById("backBtn").onclick = () => { state.view = "home"; render(); };

  fab.style.display = "none";
  homeHeroFixed.style.display = "none";
  mainEl.classList.remove("with-hero");

  const activeItems = list.items.filter(i => !i.done);
  const activeTexts = new Set(activeItems.map(i => i.text));
  const favChips = list.favorites.filter(f => !activeTexts.has(f.text));

  let html = "";

  html += `
    <div class="add-row">
      <input type="text" id="newItemInput" placeholder="追加するものを入力…" maxlength="40">
      <button id="addItemBtn" style="background:${list.color}">${ICONS.plus}</button>
    </div>
  `;

  if(list.favorites.length > 0){
    html += `
      <div class="fav-section">
        <div class="fav-label">${ICONS.star.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="12" height="12"')} よく買うもの</div>
        <div class="fav-scroll">
          ${list.favorites.map(f => {
            const alreadyIn = activeTexts.has(f.text);
            return `<div class="fav-chip ${alreadyIn?'added':''}" data-text="${escapeAttr(f.text)}">${alreadyIn?'✓ ':'+ '}${escapeHtml(f.text)}</div>`;
          }).join("")}
        </div>
      </div>
    `;
  }

  if(list.items.length === 0){
    html += `<div class="empty-hint"><img src="panda-empty.png" alt=""><br>まだ何もありません。<br>上の入力欄から追加してね📝</div>`;
  }

  html += list.items.map(item => itemRowHtml(item, list.color)).join("");

  mainEl.innerHTML = html;

  // イベント設定
  const input = document.getElementById("newItemInput");
  const addBtn = document.getElementById("addItemBtn");
  const doAdd = () => {
    const text = input.value.trim();
    if(!text) return;
    list.items.unshift({ id: uid(), text, done:false, starred:false });
    input.value = "";
    saveData();
    render();
  };
  addBtn.onclick = doAdd;
  input.addEventListener("keydown", e => { if(e.key === "Enter") doAdd(); });

  mainEl.querySelectorAll(".fav-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      if(chip.classList.contains("added")) return;
      const text = chip.dataset.text;
      list.items.unshift({ id: uid(), text, done:false, starred:true });
      saveData();
      render();
    });
  });

  mainEl.querySelectorAll(".item-row").forEach(row => {
    const itemId = row.dataset.id;
    const item = list.items.find(i => i.id === itemId);
    row.querySelector(".check").addEventListener("click", () => {
      item.done = !item.done;
      item.doneAt = item.done ? todayStr() : null;
      saveData();
      render();
    });
    row.querySelector(".starbtn").addEventListener("click", () => {
      item.starred = !item.starred;
      if(item.starred){
        if(!list.favorites.some(f => f.text === item.text)){
          list.favorites.push({ id: uid(), text: item.text });
        }
      }else{
        list.favorites = list.favorites.filter(f => f.text !== item.text);
      }
      saveData();
      render();
    });
    row.querySelector(".trashbtn").addEventListener("click", () => {
      if(!confirm(`「${item.text}」を削除しますか?`)) return;
      list.items = list.items.filter(i => i.id !== itemId);
      saveData();
      render();
    });
  });

}

function renderHistory(){
  topbar.innerHTML = `
    <button class="iconbtn" id="backBtn">${ICONS.back}</button>
    <h1>完了タスク</h1>
  `;
  document.getElementById("backBtn").onclick = () => { state.view = "home"; render(); };
  fab.style.display = "none";
  homeHeroFixed.style.display = "none";
  mainEl.classList.remove("with-hero");

  const history = state.data.history;
  if(history.length === 0){
    mainEl.innerHTML = `<div class="empty-hint"><img src="panda-empty.png" alt=""><br>まだ履歴がありません。<br>チェックしたものが、ここに残っていくよ📋</div>`;
    return;
  }

  const groups = {};
  const order = [];
  history.forEach(entry => {
    if(!groups[entry.date]){ groups[entry.date] = []; order.push(entry.date); }
    groups[entry.date].push(entry);
  });
  order.sort((a,b) => b.localeCompare(a));

  mainEl.innerHTML = order.map(date => `
    <div class="history-date">${formatDateJa(date)}</div>
    ${groups[date].map(entry => `
      <div class="history-item" data-id="${entry.id}">
        <div class="history-check" style="background:${entry.listColor}">${ICONS.check}</div>
        <div class="history-body">
          <div class="history-text">${escapeHtml(entry.text)}</div>
          <div class="history-list"><span class="dot" style="background:${entry.listColor}"></span>${escapeHtml(entry.listName)}</div>
        </div>
        <button class="history-delete-btn" data-id="${entry.id}">${ICONS.trash}</button>
      </div>
    `).join("")}
  `).join("");

  mainEl.querySelectorAll(".history-delete-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const entryId = btn.dataset.id;
      const entry = state.data.history.find(h => h.id === entryId);
      if(!entry) return;
      if(!confirm(`「${entry.text}」を履歴から削除しますか?`)) return;
      state.data.history = state.data.history.filter(h => h.id !== entryId);
      saveData();
      render();
    });
  });
}
function formatDateJa(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  const weekdays = ["日","月","火","水","木","金","土"];
  const dt = new Date(y, m-1, d);
  return `${m}月${d}日(${weekdays[dt.getDay()]})`;
}

function itemRowHtml(item, color){
  const checkStyle = item.done
    ? `border-color:${color};background:${color};`
    : `border-color:${color};`;
  return `
    <div class="item-row ${item.done?'done':''}" data-id="${item.id}">
      <div class="check ${item.done?'done':''}" style="${checkStyle}">${ICONS.check}</div>
      <div class="item-text">${escapeHtml(item.text)}</div>
      <button class="starbtn ${item.starred?'on':''}">${item.starred?ICONS.star:ICONS.starOutline}</button>
      <button class="trashbtn">${ICONS.trash}</button>
    </div>
  `;
}

/* ====================== モーダル(リスト追加・編集) ====================== */
function openListModal(listId){
  const editing = !!listId;
  const list = editing ? state.data.lists.find(l => l.id === listId) : null;
  let selectedColor = list ? list.color : PALETTE[state.data.lists.length % PALETTE.length];

  modalSheet.innerHTML = `
    <h2>${editing ? "リストを編集" : "新しいリスト"}</h2>
    <input type="text" id="listNameInput" placeholder="リスト名(例: 食料品)" maxlength="20" value="${editing?escapeAttr(list.name):''}">
    <div class="color-row" id="colorRow">
      ${PALETTE.map(c => `<div class="color-swatch ${c===selectedColor?'selected':''}" data-color="${c}" style="background:${c}"></div>`).join("")}
    </div>
    <div class="modal-actions">
      ${editing ? `<button class="btn" id="deleteListBtn">削除</button>` : ``}
      <button class="btn" id="cancelBtn">キャンセル</button>
      <button class="btn" id="saveListBtn">${editing?"保存":"作成"}</button>
    </div>
  `;
  modalBackdrop.classList.remove("hidden");

  modalSheet.querySelectorAll(".color-swatch").forEach(sw => {
    sw.addEventListener("click", () => {
      selectedColor = sw.dataset.color;
      modalSheet.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("selected"));
      sw.classList.add("selected");
    });
  });

  document.getElementById("cancelBtn").onclick = closeModal;

  document.getElementById("saveListBtn").onclick = () => {
    const name = document.getElementById("listNameInput").value.trim();
    if(!name) return;
    if(editing){
      list.name = name;
      list.color = selectedColor;
    }else{
      state.data.lists.push({ id: uid(), name, color: selectedColor, items:[], favorites:[] });
    }
    saveData();
    closeModal();
    render();
  };

  if(editing){
    document.getElementById("deleteListBtn").onclick = () => {
      if(!confirm(`「${list.name}」を削除しますか?中の項目もすべて消えます。`)) return;
      state.data.lists = state.data.lists.filter(l => l.id !== listId);
      saveData();
      closeModal();
      state.view = "home";
      render();
    };
  }
}
function closeModal(){ modalBackdrop.classList.add("hidden"); }
modalBackdrop.addEventListener("click", e => { if(e.target === modalBackdrop) closeModal(); });

/* ====================== ユーティリティ ====================== */
function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ====================== 初期化 ====================== */
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
</script>
