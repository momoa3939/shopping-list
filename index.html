<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F6CF68">
<title>お買い物リスト</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFDF9;
    --surface:#FFFFFF;
    --text:#6B5646;
    --muted:#9C8874;
    --rose:#F6CF68;
    --rose-dark:#DDAE3F;
    --star:#E8BC5A;
    --star-off:var(--delete-muted);
    --delete-muted:#BBA99A;
    --danger-text:#B8747C;
    --danger-bg:#F6E6E4;
    --danger-border:#E9C9C7;
    --divider:#EFE4D5;
    --card-border: 1px solid var(--divider);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Kosugi Maru','Hiragino Sans',sans-serif;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    position:relative;
  }
  header.topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    margin:14px 18px 6px;
    position:sticky;
    top:14px;
    background:var(--surface);
    border-radius:18px;
    border:var(--card-border);
    z-index:5;
  }
  header.topbar h1{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:20px;
    margin:0;
    flex:1;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .title-icon{
    display:inline-flex;
    color:var(--rose);
    flex-shrink:0;
  }
  .title-icon svg{ width:26px; height:26px; }
  .iconbtn{
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--text);
    flex-shrink:0;
    position:relative;
  }
  .iconbtn svg{width:19px; height:19px;}
  .iconbtn.back-btn svg{width:23px; height:23px;}
  main{ flex:1; padding:4px 18px 100px; }
  main.with-hero{ padding-bottom:16px; }

  /* (10) ホーム画面: リスト表示エリアをパンダちゃんの少し上で区切り、
     その範囲の中だけでスクロールさせる(パンダの領域には絶対に入らない) */
  body.scroll-lock, html.scroll-lock{
    height:100dvh;
    overflow:hidden;
  }
  body.scroll-lock #app{
    height:100dvh;
    overflow:hidden;
  }
  .list-scroll-area{
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }

  /* ---- Home: list of lists ---- */
  .list-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--surface);
    border-radius:18px;
    padding:16px 16px;
    margin-bottom:12px;
    border:var(--card-border);
    cursor:pointer;
    touch-action:pan-y;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  /* (11) 並び替え中のカード */
  .list-card.dragging{
    position:absolute;
    left:0; right:0;
    z-index:10;
    box-shadow:0 8px 20px rgba(59,48,38,0.18);
    opacity:0.97;
    touch-action:none;
  }
  .list-scroll-area.reordering{
    position:relative;
  }
  .list-scroll-area.reordering .list-card:not(.dragging){
    transition:transform 0.18s ease;
  }
  body.dragging-active{
    -webkit-user-select:none;
    user-select:none;
  }
  /* (11) 並び替えヒント(設定初回ヒントと同じ見た目) */
  .reorder-panda-hint{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--divider);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:12px;
    font-size:13.5px;
    color:var(--muted);
    line-height:1.5;
  }
  .reorder-panda-hint img{
    width:34px; height:34px;
    object-fit:contain;
    flex-shrink:0;
  }
  .dot{
    width:16px; height:16px;
    border-radius:50%;
    flex-shrink:0;
  }
  .list-card .name{
    flex:1;
    font-weight:700;
    font-size:16px;
    font-family:'Zen Maru Gothic', sans-serif;
  }
  .list-card .count{
    font-size:15px;
    color:var(--muted);
    padding:3px 6px;
  }
  .list-edit-btn{
    width:30px; height:30px;
    border:none;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    color:var(--muted);
  }
  .list-edit-btn svg{ width:16px; height:16px; }
  .fab{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    max-width:480px;
    width:calc(100% - 36px);
  }
  .fab-inner{
    background:var(--rose);
    color:var(--text);
    width:100%;
    padding:15px;
    border-radius:16px;
    font-size:15px;
    font-weight:700;
    font-family:'Zen Maru Gothic', sans-serif;
    border:1px solid var(--rose-dark);
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
  }
  .fab-inner svg{
    width:18px; height:18px;
    flex-shrink:0;
  }
  .empty-hint{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-top:36px;
    line-height:1.8;
  }
  .empty-hint img{
    width:150px;
    height:auto;
    margin-bottom:8px;
  }
  .home-hero-fixed{
    position:fixed;
    left:50%;
    bottom:98px;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    pointer-events:none;
    z-index:4;
  }
  .home-hero-fixed img{
    width:120px;
    height:120px;
    object-fit:contain;
    display:block;
    margin:0 auto 4px;
  }

  /* ---- Detail screen ---- */
  .add-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border-radius:16px;
    padding:6px 8px 6px 16px;
    border:var(--card-border);
    margin-bottom:16px;
  }
  .add-row input{
    flex:1;
    border:none;
    outline:none;
    font-size:15px;
    padding:10px 0;
    background:transparent;
    font-family:'Kosugi Maru',sans-serif;
    color:var(--text);
  }
  .add-row input::placeholder{ color:var(--muted); }
  .add-row button{
    width:36px; height:36px;
    border-radius:50%;
    border:none;
    background:var(--rose);
    color:#fff;
    font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }

  .fav-section{
    margin-top:22px;
    margin-bottom:10px;
  }
  .fav-label{
    font-size:12px;
    color:var(--muted);
    margin:0 0 8px 4px;
    display:flex; align-items:center; gap:4px;
  }
  .fav-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:none;
  }
  .fav-scroll::-webkit-scrollbar{ display:none; }
  .fav-chip{
    flex-shrink:0;
    background:#fff;
    border:1px solid var(--divider);
    color:var(--text);
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    display:flex; align-items:center; gap:4px;
    cursor:pointer;
    white-space:nowrap;
  }
  .fav-chip.added{
    color:var(--muted);
    border-color:var(--divider);
    opacity:1;
  }

  .item-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border-radius:16px;
    padding:14px 14px;
    margin-bottom:8px;
    border:var(--card-border);
  }
  .check{
    width:24px; height:24px;
    border-radius:50%;
    border:2px solid var(--rose);
    flex-shrink:0;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
  }
  .check.done{
    background:var(--rose);
    border-color:var(--rose);
  }
  .check svg{ width:13px; height:13px; opacity:0; }
  .check.done svg{ opacity:1; }
  .item-text{
    flex:1;
    font-size:15px;
    word-break:break-all;
  }
  .item-row.done .item-text{
    color:var(--muted);
    text-decoration:line-through;
  }
  .starbtn, .trashbtn{
    width:28px; height:28px;
    border:none;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    color:var(--star-off);
  }
  .starbtn.on{ color:var(--star); }
  .starbtn svg, .trashbtn svg{ width:19px; height:19px; }
  .trashbtn{ color:var(--delete-muted); }

  .done-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
    font-size:13px;
    padding:12px 4px;
    cursor:pointer;
  }
  .done-toggle svg{
    width:12px; height:12px;
    transition:transform 0.2s;
  }
  .done-toggle.open svg{ transform:rotate(90deg); }
  .clear-done{
    text-align:right;
    font-size:12px;
    color:var(--delete-muted);
    margin:4px 4px 10px;
    cursor:pointer;
  }

  /* ---- History ---- */
  .history-date{
    font-size:13px;
    color:var(--muted);
    margin:18px 4px 8px;
  }
  .history-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border-radius:16px;
    padding:14px 14px;
    margin-bottom:8px;
    border:var(--card-border);
  }
  .history-check{
    width:24px; height:24px;
    border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .history-check svg{ width:13px; height:13px; }
  .history-body{ flex:1; }
  .history-text{
    font-size:15px;
    color:var(--muted);
    text-decoration:line-through;
  }
  .history-list{
    font-size:12px;
    color:var(--muted);
    display:flex; align-items:center; gap:5px;
    margin-top:3px;
  }
  .history-list .dot{
    width:8px; height:8px;
  }
  .history-delete-btn{
    width:28px; height:28px;
    border:none;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    color:var(--delete-muted);
  }
  .history-delete-btn svg{ width:17px; height:17px; }

  /* ---- Modal ---- */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(58,53,50,0.35);
    display:flex; align-items:flex-end;
    z-index:20;
  }
  .modal-backdrop.hidden{ display:none; }
  .modal-sheet{
    background:var(--surface);
    width:100%;
    max-width:480px;
    margin:0 auto;
    border-radius:22px 22px 0 0;
    padding:22px 20px 28px;
    max-height:82vh;
    overflow-y:auto;
  }
  .modal-sheet h2{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:17px;
    margin:0 0 16px;
  }
  .modal-sheet input[type=text]{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1px solid var(--divider);
    font-size:15px;
    margin-bottom:16px;
    font-family:'Kosugi Maru',sans-serif;
    color:var(--text);
    outline:none;
  }
  .help-content{
    font-size:14.5px;
    line-height:1.7;
    color:var(--text);
  }
  .help-content p{
    margin:0 0 14px;
  }
  .help-content h3{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:16px;
    margin:28px 0 12px;
    padding-top:18px;
    border-top:1px solid var(--divider);
  }
  .help-content .help-subhead{
    font-weight:700;
    margin-bottom:6px;
  }
  .help-content .help-note{
    font-size:13px;
    color:var(--muted);
  }
  .color-row{
    display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap;
  }
  .color-swatch{
    width:30px; height:30px;
    border-radius:50%;
    cursor:pointer;
    border:3px solid transparent;
  }
  .color-swatch.selected{
    border-color:var(--text);
  }
  .color-swatch.disabled{
    opacity:0.25;
    cursor:not-allowed;
    filter:grayscale(60%);
  }
  .modal-actions{
    display:flex; gap:10px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:12px;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--muted);
    font-size:14px;
    font-weight:700;
    font-family:'Zen Maru Gothic', sans-serif;
    cursor:pointer;
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  .btn:hover, .btn:active{
    background:var(--rose);
    color:var(--text);
    border-color:var(--rose);
  }

  /* ---- 設定ボタンの初回バッジ ---- */
  .gear-badge{
    position:absolute;
    top:2px; right:2px;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--danger-text);
    border:2px solid var(--bg);
    pointer-events:none;
  }

  /* ---- 設定メニュー ---- */
  .settings-menu{
    display:flex;
    flex-direction:column;
  }
  .settings-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:transparent;
    border:none;
    text-align:left;
    padding:14px 4px;
    font-size:15px;
    font-family:'Kosugi Maru',sans-serif;
    color:var(--text);
    cursor:pointer;
  }
  .settings-item .settings-icon{
    font-size:17px;
    width:22px;
    flex-shrink:0;
    text-align:center;
  }
  .settings-divider{
    height:1px;
    background:var(--divider);
    margin:4px 0;
    border:none;
  }

  /* ---- 設定初回のパンダヒント ---- */
  .settings-panda-hint{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--bg);
    border:1px solid var(--divider);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:14px;
    font-size:13.5px;
    color:var(--muted);
    line-height:1.5;
  }
  .settings-panda-hint img{
    width:34px; height:34px;
    object-fit:contain;
    flex-shrink:0;
  }

  /* (8) help-panda-tip: 見た目を通常の<p>と統一するため装飾は付けない */

  /* (7) 「このアプリについて」モーダル内のパンダ画像 */
  .about-panda{
    display:block;
    width:48px;
    height:48px;
    object-fit:contain;
    margin:0 auto 14px;
  }

  /* (9) リスト詳細画面 下部の見守りパンダ */
  .detail-watch-panda{
    display:flex;
    justify-content:center;
    margin:16px 0 4px;
    opacity:0.85;
  }
  .detail-watch-panda img{
    width:36px;
    height:auto;
    display:block;
  }
</style>
</head>
<body>
<div id="app">

  <header class="topbar" id="topbar"></header>
  <main id="main"></main>

  <div class="home-hero-fixed" id="homeHeroFixed" style="display:none;">
    <img src="panda13.png" alt="">
    今日は何をメモしよっか？
  </div>

  <div class="fab" id="fab" style="display:none;">
    <button class="fab-inner" id="fabBtn"></button>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal-sheet" id="modalSheet"></div>
  </div>

</div>

<script>
/* ====================== データ管理 ====================== */
const STORAGE_KEY = "yumeListData";
const PALETTE = ["#A37B68","#C7B299","#B8B2A9","#F6CF68","#F0C9B0","#E6B8BE","#CDBFDD","#BFD6E8","#AEDFD1","#A8BFA5"];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function loadData(){
  let data = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) data = JSON.parse(raw);
  }catch(e){}
  if(!data){
    data = {
      lists:[
        { id: uid(), name:"買うもの", color:"#A8BFA5", items:[], favorites:[] },
        { id: uid(), name:"やること", color:"#E6B8BE", items:[], favorites:[] }
      ],
      history:[]
    };
  }
  if(!data.history) data.history = [];
  return data;
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }

/* ---- 初回案内(オンボーディング)フラグ ---- */
const ONBOARDING_KEY = "shoppingListOnboarding";
function getOnboarding(){
  try{
    const raw = localStorage.getItem(ONBOARDING_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { gearBadgeSeen:false, settingsHintSeen:false, reorderHintSeen:false };
}
function setOnboarding(patch){
  const current = getOnboarding();
  const updated = Object.assign(current, patch);
  localStorage.setItem(ONBOARDING_KEY, JSON.stringify(updated));
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const state = {
  data: loadData(),
  view: "home",        // "home" | "detail" | "history"
  currentListId: null
};

/* ====================== 完了アイテムの履歴移動 ====================== */
// (12) チェックしてもすぐには履歴に移動せず、一定時間(猶予)経過後に移動する
//      うっかりチェックしてもしばらくは元に戻せるようにするための仕様
const DONE_GRACE_MS = 6 * 60 * 60 * 1000; // 6時間(3時間〜半日の目安の中間値。変更したい場合はここを調整)

function nowISO(){ return new Date().toISOString(); }

function migrateCompletedToHistory(){
  let changed = false;
  const now = Date.now();
  state.data.lists.forEach(list => {
    const stillActive = [];
    list.items.forEach(item => {
      if(item.done){
        const doneTime = item.doneAt ? new Date(item.doneAt).getTime() : now;
        const elapsed = now - doneTime;
        if(!isNaN(doneTime) && elapsed >= DONE_GRACE_MS){
          state.data.history.unshift({
            id: uid(),
            text: item.text,
            listName: list.name,
            listColor: list.color,
            date: item.doneAt ? item.doneAt.slice(0,10) : todayStr()
          });
          changed = true;
        }else{
          stillActive.push(item);
        }
      }else{
        stillActive.push(item);
      }
    });
    list.items = stillActive;
  });
  if(changed) saveData();
  return changed;
}
migrateCompletedToHistory();

// アプリを開いたままにしている間も、猶予時間が経過したら自動で履歴へ移す
setInterval(() => {
  const changed = migrateCompletedToHistory();
  if(changed) render();
}, 5 * 60 * 1000); // 5分ごとに確認

/* ====================== アイコン ====================== */
const ICONS = {
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="#6B5646" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 7"/></svg>`,
  star: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.7 1.6 7-6.2-3.8L5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>`,
  starOutline: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.7 1.6 7-6.2-3.8L5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  chevron: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`,

/* ====================== (11) リストカードの長押し並び替え ====================== */
function attachReorderHandlers(container){
  if(state.data.lists.length < 2) return;

  container.querySelectorAll(".list-card").forEach(card => {
    let pressTimer = null;
    let startX = 0, startY = 0;
    let longPressFired = false;

    const cancelPress = () => {
      if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
    };

    card.addEventListener("pointerdown", (e) => {
      if(e.target.closest(".list-edit-btn")) return;
      if(e.pointerType === "mouse" && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY;
      longPressFired = false;
      pressTimer = setTimeout(() => {
        longPressFired = true;
        startListDrag(card, e, container);
      }, 450);
    });

    card.addEventListener("pointermove", (e) => {
      if(pressTimer){
        if(Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) cancelPress();
      }
    });

    card.addEventListener("pointerup", cancelPress);
    card.addEventListener("pointercancel", cancelPress);

    // 長押し→ドラッグが発火した場合は、直後の click(=リスト詳細へ遷移)を打ち消す
    card.addEventListener("click", (e) => {
      if(longPressFired){
        e.stopPropagation();
        e.preventDefault();
        longPressFired = false;
      }
    }, true);
  });
}

function startListDrag(card, startEvent, container){
  if(navigator.vibrate) navigator.vibrate(12);

  const cards = Array.from(container.querySelectorAll(".list-card"));
  const draggedId = card.dataset.id;
  const containerRect = container.getBoundingClientRect();

  // ドラッグ開始時点の各カードの位置(コンテナのコンテンツ基準・スクロール量を考慮)を記録
  const scrollTopAtStart = container.scrollTop;
  const originalRects = cards.map(c => {
    const r = c.getBoundingClientRect();
    return { id: c.dataset.id, top: (r.top - containerRect.top) + scrollTopAtStart, height: r.height };
  });
  const draggedIndex = originalRects.findIndex(r => r.id === draggedId);
  const slotHeight = originalRects.length > 1
    ? (originalRects[1].top - originalRects[0].top)
    : (originalRects[0].height + 12);
  const cardRect = card.getBoundingClientRect();
  const offsetWithinCard = startEvent.clientY - cardRect.top;

  const otherIdsInOrder = originalRects.filter(r => r.id !== draggedId).map(r => r.id);
  let currentTargetIndex = draggedIndex;

  container.classList.add("reordering");
  document.body.classList.add("dragging-active");
  card.classList.add("dragging");
  card.style.top = originalRects[draggedIndex].top + "px";
  card.style.height = originalRects[draggedIndex].height + "px";
  try{ card.setPointerCapture(startEvent.pointerId); }catch(e){}

  function applyOtherCardTransforms(targetIndex){
    // targetIndex: ドラッグ中カードが今どの位置に割り込んでいるか
    const newOrder = otherIdsInOrder.slice(0, targetIndex)
      .concat([draggedId])
      .concat(otherIdsInOrder.slice(targetIndex));

    cards.forEach(c => {
      if(c === card) return;
      const orig = originalRects.find(r => r.id === c.dataset.id);
      const newIdx = newOrder.indexOf(c.dataset.id);
      const newTop = newIdx * slotHeight + originalRects[0].top;
      c.style.transform = `translateY(${newTop - orig.top}px)`;
    });
  }

  function onMove(e){
    const maxTop = container.scrollHeight - originalRects[draggedIndex].height;
    let top = (e.clientY - containerRect.top) + container.scrollTop - offsetWithinCard;
    top = Math.max(0, Math.min(top, Math.max(0, maxTop)));
    card.style.top = top + "px";

    const dragCenter = top + originalRects[draggedIndex].height / 2 - originalRects[0].top;
    let targetIndex = Math.round(dragCenter / slotHeight);
    targetIndex = Math.max(0, Math.min(targetIndex, otherIdsInOrder.length));
    if(targetIndex !== currentTargetIndex){
      currentTargetIndex = targetIndex;
      applyOtherCardTransforms(targetIndex);
    }
  }

  function onUp(){
    card.removeEventListener("pointermove", onMove);
    card.removeEventListener("pointerup", onUp);
    card.removeEventListener("pointercancel", onUp);

    const newOrderIds = otherIdsInOrder.slice(0, currentTargetIndex)
      .concat([draggedId])
      .concat(otherIdsInOrder.slice(currentTargetIndex));

    // state.data.lists を新しい順番に並び替え
    const listsById = {};
    state.data.lists.forEach(l => { listsById[l.id] = l; });
    state.data.lists = newOrderIds.map(id => listsById[id]);

    saveData();
    document.body.classList.remove("dragging-active");
    render();
  }

  card.addEventListener("pointermove", onMove);
  card.addEventListener("pointerup", onUp);
  card.addEventListener("pointercancel", onUp);
}

/* (10) ホーム画面: リスト表示エリアの高さを、パンダちゃんの少し上までに区切る。
   これにより、どれだけスクロールしてもリストがパンダの領域に入り込まない */
function adjustHomeScrollPadding(){
  if(state.view !== "home" || state.data.lists.length === 0) return;
  const listScrollArea = document.getElementById("listScrollArea");
  if(!listScrollArea) return;
  requestAnimationFrame(() => {
    const heroRect = homeHeroFixed.getBoundingClientRect();
    const areaRect = listScrollArea.getBoundingClientRect();
    const gapAbovePanda = 4; // パンダちゃんの「ちょっと上」の余白(6個分の収まりを優先してさらに詰めた)
    const availableHeight = heroRect.top - areaRect.top - gapAbovePanda;
    listScrollArea.style.height = Math.max(80, availableHeight) + "px";
  });
}
window.addEventListener("resize", adjustHomeScrollPadding);
window.addEventListener("load", adjustHomeScrollPadding);

  if(heroImg){
    if(heroImg.complete) adjustHomeScrollPadding();
    else heroImg.addEventListener("load", adjustHomeScrollPadding);

function renderDetail(){
  const list = getCurrentList();
  if(!list){ state.view = "home"; render(); return; }

  topbar.innerHTML = `
    <button class="iconbtn back-btn" id="backBtn">${ICONS.back}</button>
    <h1>${escapeHtml(list.name)}</h1>
  `;
  document.getElementById("backBtn").onclick = () => { state.view = "home"; render(); };

  document.body.classList.remove("scroll-lock");
  fab.style.display = "none";
  homeHeroFixed.style.display = "none";
  mainEl.classList.remove("with-hero");
  mainEl.style.paddingBottom = "";

  const activeItems = list.items.filter(i => !i.done);
  const activeTexts = new Set(activeItems.map(i => i.text));
  const favChips = list.favorites.filter(f => !activeTexts.has(f.text));

  let html = "";

  html += `
    <div class="add-row">
      <input type="text" id="newItemInput" placeholder="追加するものを入力…" maxlength="40">
      <button id="addItemBtn" style="background:${list.color}">${ICONS.plus}</button>
    </div>
  `;

  if(list.items.length === 0){
    html += `<div class="empty-hint"><img src="panda-empty.png" alt=""><br>まだ何もありません。<br>上の入力欄から追加してね📝</div>`;
  }

  html += list.items.map(item => itemRowHtml(item, list.color)).join("");

  if(list.favorites.length > 0){
    html += `
      <div class="fav-section">
        <div class="fav-label">${ICONS.star.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="12" height="12"')} よく買うもの</div>
        <div class="fav-scroll">
          ${list.favorites.map(f => {
            const alreadyIn = activeTexts.has(f.text);
            return `<div class="fav-chip ${alreadyIn?'added':''}" data-text="${escapeAttr(f.text)}">${alreadyIn?'✓ ':'+ '}${escapeHtml(f.text)}</div>`;
          }).join("")}
        </div>
      </div>
    `;
  }

  if(list.items.length > 0){
    html += `<div class="detail-watch-panda"><img src="panda-watch.png" alt=""></div>`;
  }

  mainEl.innerHTML = html;

  // イベント設定
  const input = document.getElementById("newItemInput");
  const addBtn = document.getElementById("addItemBtn");
  const doAdd = () => {
    const text = input.value.trim();
    if(!text) return;
    list.items.unshift({ id: uid(), text, done:false, starred:false });
    input.value = "";
    saveData();
    render();
  };
  addBtn.onclick = doAdd;
  input.addEventListener("keydown", e => { if(e.key === "Enter") doAdd(); });

  mainEl.querySelectorAll(".fav-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      if(chip.classList.contains("added")) return;
      const text = chip.dataset.text;
      list.items.unshift({ id: uid(), text, done:false, starred:true });
      saveData();
      render();
    });
  });

  mainEl.querySelectorAll(".item-row").forEach(row => {
    const itemId = row.dataset.id;
    const item = list.items.find(i => i.id === itemId);
    row.querySelector(".check").addEventListener("click", () => {
      item.done = !item.done;
      item.doneAt = item.done ? nowISO() : null;
      saveData();
      render();
    });
    row.querySelector(".starbtn").addEventListener("click", () => {
      item.starred = !item.starred;
      if(item.starred){
        if(!list.favorites.some(f => f.text === item.text)){
          list.favorites.push({ id: uid(), text: item.text });
        }
      }else{
        list.favorites = list.favorites.filter(f => f.text !== item.text);
      }
      saveData();
      render();
    });
    row.querySelector(".trashbtn").addEventListener("click", () => {
      if(!confirm(`「${item.text}」を削除しますか?`)) return;
      list.items = list.items.filter(i => i.id !== itemId);
      saveData();
      render();
    });
  });

}

function renderHistory(){
  topbar.innerHTML = `
    <button class="iconbtn back-btn" id="backBtn">${ICONS.back}</button>
    <h1>完了タスク</h1>
  `;
  document.getElementById("backBtn").onclick = () => { state.view = "home"; render(); };
  document.body.classList.remove("scroll-lock");
  fab.style.display = "none";
  homeHeroFixed.style.display = "none";
  mainEl.classList.remove("with-hero");
  mainEl.style.paddingBottom = "";

  const history = state.data.history;
  if(history.length === 0){
    mainEl.innerHTML = `<div class="empty-hint"><img src="panda-empty.png" alt=""><br>まだ履歴がありません。<br>チェックしたものが、ここに残っていくよ📋</div>`;
    return;
  }

  const groups = {};
  const order = [];
  history.forEach(entry => {
    if(!groups[entry.date]){ groups[entry.date] = []; order.push(entry.date); }
    groups[entry.date].push(entry);
  });
  order.sort((a,b) => b.localeCompare(a));

  mainEl.innerHTML = order.map(date => `
    <div class="history-date">${formatDateJa(date)}</div>
    ${groups[date].map(entry => `
      <div class="history-item" data-id="${entry.id}">
        <div class="history-check" style="background:${entry.listColor}">${ICONS.check}</div>
        <div class="history-body">
          <div class="history-text">${escapeHtml(entry.text)}</div>
          <div class="history-list"><span class="dot" style="background:${entry.listColor}"></span>${escapeHtml(entry.listName)}</div>
        </div>
        <button class="history-delete-btn" data-id="${entry.id}">${ICONS.trash}</button>
      </div>
    `).join("")}
  `).join("");

  mainEl.querySelectorAll(".history-delete-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const entryId = btn.dataset.id;
      const entry = state.data.history.find(h => h.id === entryId);
      if(!entry) return;
      if(!confirm(`「${entry.text}」を履歴から削除しますか?`)) return;
      state.data.history = state.data.history.filter(h => h.id !== entryId);
      saveData();
      render();
    });
  });
}
function formatDateJa(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  const weekdays = ["日","月","火","水","木","金","土"];
  const dt = new Date(y, m-1, d);
  return `${m}月${d}日(${weekdays[dt.getDay()]})`;
}

function itemRowHtml(item, color){
  const checkStyle = item.done
    ? `border-color:${color};background:${color};`
    : `border-color:${color};`;
  return `
    <div class="item-row ${item.done?'done':''}" data-id="${item.id}">
      <div class="check ${item.done?'done':''}" style="${checkStyle}">${ICONS.check}</div>
      <div class="item-text">${escapeHtml(item.text)}</div>
      <button class="starbtn ${item.starred?'on':''}">${item.starred?ICONS.star:ICONS.starOutline}</button>
      <button class="trashbtn">${ICONS.trash}</button>
    </div>
  `;
}

/* ====================== モーダル(リスト追加・編集) ====================== */
function openListModal(listId){
  const editing = !!listId;
  const list = editing ? state.data.lists.find(l => l.id === listId) : null;
  let selectedColor = list ? list.color : PALETTE[state.data.lists.length % PALETTE.length];

  // 他のリストで既に使われている色(編集中の自分自身は除く)
  const usedColors = state.data.lists
    .filter(l => !editing || l.id !== listId)
    .map(l => l.color);

  modalSheet.innerHTML = `
    <h2>${editing ? "リストを編集" : "新しいリスト"}</h2>
    <input type="text" id="listNameInput" placeholder="リスト名(例：食料品)" maxlength="20" value="${editing?escapeAttr(list.name):''}">
    <div class="color-row" id="colorRow">
      ${PALETTE.map(c => {
        const isUsed = usedColors.includes(c);
        return `<div class="color-swatch ${c===selectedColor?'selected':''} ${isUsed?'disabled':''}" data-color="${c}" style="background:${c}"></div>`;
      }).join("")}
    </div>
    <div class="modal-actions">
      ${editing ? `<button class="btn" id="deleteListBtn">削除</button>` : ``}
      <button class="btn" id="cancelBtn">キャンセル</button>
      <button class="btn" id="saveListBtn">${editing?"保存":"作成"}</button>
    </div>
  `;
  modalBackdrop.classList.remove("hidden");

  modalSheet.querySelectorAll(".color-swatch").forEach(sw => {
    sw.addEventListener("click", () => {
      if(sw.classList.contains("disabled")) return;
      selectedColor = sw.dataset.color;
      modalSheet.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("selected"));
      sw.classList.add("selected");
    });
  });

  document.getElementById("cancelBtn").onclick = closeModal;

  document.getElementById("saveListBtn").onclick = () => {
    const name = document.getElementById("listNameInput").value.trim();
    if(!name) return;
    if(editing){
      list.name = name;
      list.color = selectedColor;
    }else{
      state.data.lists.push({ id: uid(), name, color: selectedColor, items:[], favorites:[] });
    }
    saveData();
    closeModal();
    render();
  };

  if(editing){
    document.getElementById("deleteListBtn").onclick = () => {
      if(!confirm(`「${list.name}」を削除しますか?中の項目もすべて消えます。`)) return;
      state.data.lists = state.data.lists.filter(l => l.id !== listId);
      saveData();
      closeModal();
      state.view = "home";
      render();
    };
  }
}

/* ====================== 表示データのリセット(キャッシュ削除) ====================== */
async function resetDisplayCache(){
  if(!confirm("表示をリセットします。リストの中身は消えません。よろしいですか?")){
    return;
  }
  try{
    if("caches" in window){
      const keys = await caches.keys();
      await Promise.all(keys.map((key) => caches.delete(key)));
    }
    if("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((reg) => reg.unregister()));
    }
  }catch(e){
    // 失敗しても、とりあえず読み込み直しは試みる
  }
  location.reload();
}

/* ====================== バックアップ・復元 ====================== */
function doBackup(){
  try{
    const json = JSON.stringify(state.data, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const dateStr = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    const a = document.createElement("a");
    a.href = url;
    a.download = `shopping-list-backup-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    alert("バックアップの保存に失敗しました。");
  }
}

function triggerRestore(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.style.display = "none";
  input.addEventListener("change", () => {
    const file = input.files && input.files[0];
    if(!file){ input.remove(); return; }
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try{
        parsed = JSON.parse(reader.result);
      }catch(e){
        alert("このファイルは読み込めませんでした。正しいバックアップファイルか確認してください。");
        input.remove();
        return;
      }
      if(!parsed || !Array.isArray(parsed.lists)){
        alert("このファイルはバックアップ形式ではないようです。");
        input.remove();
        return;
      }
      if(!confirm("復元すると現在のデータは上書きされます。よろしいですか?")){
        input.remove();
        return;
      }
      if(!parsed.history) parsed.history = [];
      state.data = parsed;
      saveData();
      closeModal();
      state.view = "home";
      render();
      input.remove();
    };
    reader.readAsText(file);
  });
  document.body.appendChild(input);
  input.click();
}

function closeModal(){ modalBackdrop.classList.add("hidden"); }
modalBackdrop.addEventListener("click", e => { if(e.target === modalBackdrop) closeModal(); });

/* ====================== ユーティリティ ====================== */
function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ====================== 初期化 ====================== */
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
